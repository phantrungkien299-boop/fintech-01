<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Fintech Demo</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #e0f2fe, #dcfce7);
        color: #111827;
      }

      .card {
        width: min(92vw, 760px);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .badge {
        display: inline-block;
        background: #dbeafe;
        color: #1d4ed8;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 0;
        font-size: clamp(2rem, 3vw, 2.7rem);
        color: #0f172a;
      }

      .subtitle {
        margin: 8px 0 0;
        color: #475569;
        font-size: 1rem;
      }

      .input-wrap {
        display: flex;
        gap: 12px;
        margin-top: 26px;
      }

      input {
        flex: 1;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      button {
        padding: 14px 22px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.2);
      }

      button:hover {
        transform: translateY(-1px);
      }

      .panel {
        margin-top: 28px;
        background: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 20px;
      }

      .panel-title {
        margin: 0 0 12px;
        font-size: 1.1rem;
        color: #1e293b;
      }

      pre {
        min-height: 150px;
        margin: 0;
        background: white;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 14px 16px;
        overflow-x: auto;
        font-size: 13px;
        color: #334155;
        line-height: 1.6;
      }

      @media (max-width: 640px) {
        .card {
          padding: 22px 18px;
        }

        .header,
        .input-wrap {
          flex-direction: column;
          align-items: stretch;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div>
          <span class="badge">Application-web</span>
          <h1>Mini Fintech</h1>
          <p class="subtitle">MBF NET.VPN</p>
        </div>
      </div>

      <div class="input-wrap">
        <input id="name" placeholder="Nhập tên người dùng" />
        <button onclick="save()">Save</button>
      </div>

      <div class="panel">
        <h2 class="panel-title">Danh sách người dùng</h2>
        <pre id="out">Đang tải dữ liệu...</pre>
      </div>
    </div>

    <script>
      async function save() {
        const name = document.getElementById("name").value;

        await fetch("/api/add", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ name }),
        });

        load();
      }

      async function load() {
        const r = await fetch("/api/users");
        const d = await r.json();
        document.getElementById("out").innerText = JSON.stringify(d, null, 2);
      }

      load();
    </script>
  </body>
</html>
